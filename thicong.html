<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FECON Thi công</title>
<style>
/* FECON South · Thi công — lấy nguyên hệ màu, chữ, thẻ của app Kho 5.30 */
:root{
  --primary:#0056A4;--primary-dark:#003F7D;--navy:#0B2545;--splash:#0B1B33;
  --orange:#F26522;--orange2:#FF8C42;--green:#27AE60;--red:#E74C3C;--blue:#2980B9;--amber:#E9A10C;
  --bg:#F0F2F5;--card:#FFFFFF;--border:#E8ECF0;
  --text:#1A2332;--text2:#5A6A7A;--text3:#7B8BA1;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.15);
  --r:16px;--r-sm:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.scr{width:100%;max-width:640px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;color:var(--text);height:100%}
.grow{flex:1;overflow:hidden}

/* ── Đầu trang (giống Kho 5.24: nền trắng, vạch cam 3px) ── */
.hdr{background:#fff;border-bottom:3px solid var(--orange);padding:10px 14px 8px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.hdr-menu{margin-top:4px;width:44px;height:44px;border-radius:50%;background:#F0F2F5;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;cursor:pointer}
.hdr-menu span{display:block;width:16px;height:2px;background:var(--navy);border-radius:1px}
.hdr-logo{width:168px;height:auto;display:block}
.hdr-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.hdr-mod{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--orange);text-transform:uppercase}
.hdr-right{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.hdr-ava{width:44px;height:44px;border-radius:50%;background:#FFF1E8;border:2px solid #E1E6ED;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-size:13px}
.hdr-help{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);background:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}

/* thanh đồng bộ (5.24.1: chữ đậm 12,5px, không nền) */
.sync{background:#fff;padding:6px 16px 7px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
.sync.ok{color:#1E7A45}.sync.wait{color:#9A6700}.sync.err{color:#B42318}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}

/* ── Trang chi tiết (giống detail-page của Kho) ── */
.dhdr{background:#fff;border-bottom:1px solid var(--border);padding:14px 14px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.back{width:38px;height:38px;border-radius:50%;background:var(--bg);border:none;font-size:22px;line-height:1;color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.dtitle{font-size:17px;font-weight:800;flex:1;min-width:0}
.dsub{font-size:11.5px;color:var(--text3);font-weight:600;margin-top:2px}
.dbody{padding:14px;display:flex;flex-direction:column;gap:12px}

/* tiêu đề trang danh sách */
.ptitle{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 10px}
.ptitle b{font-size:19px;font-weight:800}
.ptitle span{font-size:12px;color:var(--text3);font-weight:600}

.chip-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;flex-wrap:nowrap;scrollbar-width:none}.chip-row::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--border);color:var(--text2);background:#fff;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.chip.navy.on{background:var(--navy);border-color:var(--navy)}

.section{padding:0 14px 12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.sec-title{font-size:14px;font-weight:800}
.sec-link{font-size:12px;color:var(--orange);font-weight:700}

.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.pad{padding:14px 16px}

.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 14px}
.stat{background:#fff;border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);position:relative}
.stat-l{font-size:12px;font-weight:800;margin-bottom:6px}
.stat-v{font-size:28px;font-weight:900;line-height:1}
.stat-s{font-size:11.5px;color:var(--text3);margin-top:4px;font-weight:600}
.c-or{color:var(--orange)}.c-gr{color:#1E7A45}.c-rd{color:#C0392B}.c-bl{color:var(--primary)}.c-am{color:#9A6700}.c-mut{color:var(--text3)}

/* dòng danh sách (txn-row của Kho) */
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:#EEF4FF}
.ico.or{background:#FFF1E8}.ico.gr{background:#E9F7EF}.ico.rd{background:#FDECEC}.ico.am{background:#FFF7E0}.ico.gy{background:var(--bg)}
.rmain{flex:1;min-width:0}
.rname{font-size:14px;font-weight:700}
.rsub{font-size:11.5px;color:var(--text3);margin-top:2px;font-weight:500}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chev{color:#C5CED9;font-size:20px;font-weight:700}
.badge{font-size:12px;font-weight:800;padding:5px 10px;border-radius:9px;white-space:nowrap}
.b-bl{background:#E3EEFA;color:#1A5FA8}.b-gr{background:#E9F7EF;color:#1E7A45}.b-rd{background:#FDECEC;color:#B42318}.b-or{background:#FFF1E8;color:#C2410C}.b-am{background:#FFF7E0;color:#8A5A00}.b-gy{background:var(--bg);color:var(--text2)}.b-nv{background:#E8EDF5;color:var(--navy)}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap}

/* form (form-section / fg của Kho) */
.fsec{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.fsec-t{font-size:15px;font-weight:800;padding-bottom:10px;border-bottom:2px solid var(--orange);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.fsec-t small{margin-left:auto;font-size:11px;color:var(--text3);font-weight:700}
.fg{margin-bottom:12px}
.fg:last-child{margin-bottom:0}
.fg label{display:block;font-size:10px;font-weight:800;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;font-size:14px;color:var(--text);background:#fff;font-family:inherit;outline:none}
.fg input.calc{background:#F6F8FB;color:var(--primary);font-weight:800}
.fg input.warn{border-color:#E9A10C;background:#FFFBF0}
.fg .unit{font-size:11px;color:var(--text3);font-weight:700;margin-top:4px}
.fg-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* kv-box (chi tiết phiếu của Kho) */
.kv-box{background:var(--bg);border-radius:12px;padding:2px 14px}
.kv-box.w{background:#fff}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--text3)}
.kv b{font-weight:700;text-align:right}
.kv a{color:var(--primary);text-decoration:underline;font-weight:700}

/* nút */
.btn{border:none;border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:800;color:#fff;background:var(--orange);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center}
.btn.pri{background:var(--primary)}.btn.gr{background:var(--green)}.btn.zalo{background:#0068FF}
.btn.ghost{background:var(--bg);color:var(--text2);font-weight:700}
.btn.line{background:#fff;color:var(--orange);border:1.5px solid var(--orange)}
.btn.sm{padding:10px 12px;font-size:13px}
.actbar{background:#fff;border-top:1px solid var(--border);padding:10px 14px 14px;display:flex;gap:8px;flex-shrink:0;box-shadow:0 -4px 14px rgba(16,24,40,.06)}
.actbar .btn.ghost{flex:1}.actbar .btn:not(.ghost){flex:2}

/* hộp thông báo */
.note{border-radius:12px;padding:11px 13px;font-size:12.5px;font-weight:600;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.n-warn{background:#FFF7E0;color:#7A4E00}.n-err{background:#FDECEC;color:#9B1C1C}.n-info{background:#EEF4FF;color:#1A4C8A}.n-ok{background:#E9F7EF;color:#17663A}.n-gy{background:var(--bg);color:var(--text2)}
.note b{font-weight:800}

/* tiến độ */
.prog{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--orange)}

/* công đoạn (stepper) */
.steps{display:flex;flex-direction:column}
.st{display:flex;gap:12px;padding:11px 16px;align-items:center;border-bottom:1px solid var(--border);position:relative}
.st:last-child{border-bottom:none}
.st-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;background:var(--bg);color:var(--text3);border:2px solid var(--border)}
.st.done .st-n{background:var(--green);border-color:var(--green);color:#fff}
.st.now{background:#FFF8F3}
.st.now .st-n{background:var(--orange);border-color:var(--orange);color:#fff}
.st.hold .st-n{background:#fff;border-color:#B42318;color:#B42318}
.st-t{font-size:13.5px;font-weight:700}
.st-s{font-size:11.5px;color:var(--text3);margin-top:1px;font-weight:500}

/* số lớn (nhập lúc đổ bê tông) */
.big{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:10px 12px}
.big label{display:block;font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.big .v{font-size:30px;font-weight:900;line-height:1.1;margin-top:3px}
.big .v small{font-size:13px;color:var(--text3);font-weight:700;margin-left:3px}
.big.calc{background:#F6F8FB}
.big.ok{border-color:#9ED8B4;background:#F3FBF6}
.big.on{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,101,34,.12)}

/* bảng nhỏ */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;background:#F6F8FB;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}

/* thanh điều hướng dưới (bottom-nav của Kho) */
.bnav{background:#fff;border-top:1px solid var(--border);display:flex;flex-shrink:0;box-shadow:0 -4px 14px rgba(16,24,40,.06);padding:6px 0 10px}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--text3);position:relative;padding-top:2px}
.bn .bi{font-size:24px;line-height:1.1;position:relative}
.bn.on{color:var(--orange)}
.bn.on::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--orange);margin-top:1px}
.bn .bb{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px;line-height:1.3;border:2px solid #fff}

/* màn chào / đăng nhập (giống splash Kho #0B1B33) */
.splash{background:var(--splash);color:#fff}
.sp-box{background:#fff;border-radius:22px;padding:18px 22px;display:flex;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px}
.mod{background:#fff;color:var(--text);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mod-ico{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.mod-t{font-size:18px;font-weight:900}
.mod-s{font-size:12px;color:var(--text2);margin-top:3px;font-weight:600;line-height:1.4}
.mod-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* sidebar menu */
.sb-item{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:14px;font-weight:700}
.sb-item .i{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px}
.sb-grp{font-size:10.5px;font-weight:800;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;padding:14px 18px 4px}

/* sheet (modal-sheet của Kho) */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.sheet{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:640px;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));z-index:51;max-height:88vh;overflow:auto}
.handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;font-weight:700;color:var(--text2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mono{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--border)}
.small{font-size:11.5px;color:var(--text3);font-weight:600}
.photo{width:76px;height:76px;border-radius:12px;background:#DDE3EA;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2);font-weight:700;text-align:center;flex-shrink:0}
.photo.add{background:#fff;border:1.5px dashed #C5CED9;flex-direction:column;gap:4px}

/* ── Thi công 1.0: bổ sung cho app thật ── */
html,body{height:100%;overscroll-behavior:none}
body{background:#E6EAF0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.hdr{padding-top:calc(10px + env(safe-area-inset-top))}
.dhdr{padding-top:calc(14px + env(safe-area-inset-top))}
.hdr-logo{width:150px}
.hdr-mid{flex:1}
.bnav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.actbar{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.bn{background:none;border:none}
.chip{cursor:pointer}
.row.tap,.tap{cursor:pointer}
.row.tap:active,.st.tap:active,.card.tap:active{background:#F6F8FB}
.main .dbody{padding-bottom:30px}
.hide{display:none!important}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.center{text-align:center}
.empty{padding:28px 16px;text-align:center;color:var(--text3);font-weight:600;font-size:13px}
.btn:disabled{opacity:.45}
.btn.rd{background:#C0392B}
.btn.nv{background:var(--navy)}
.btn.auto{width:auto;padding:9px 14px;font-size:13px}
.fg input:disabled,.fg select:disabled,.fg textarea:disabled{background:#F6F8FB;color:var(--text2)}
.fg input.bad{border-color:#E74C3C;background:#FFF5F5}
.fg .hint{font-size:11px;font-weight:700;margin-top:4px}
.fg .hint.w{color:#9A6700}.fg .hint.e{color:#B42318}.fg .hint.o{color:#1E7A45}
.fg textarea{min-height:76px;resize:vertical}
.fg-row>.fg,.fg-row3>.fg{margin-bottom:12px}
.ynrow{display:flex;gap:6px;flex-wrap:wrap}
.yn{padding:9px 13px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13px;color:var(--text2)}
.yn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.yn.on.g{background:#1E7A45;border-color:#1E7A45}.yn.on.r{background:#B42318;border-color:#B42318}.yn.on.o{background:var(--orange);border-color:var(--orange)}
/* bảng nhập nhiều dòng */
.rt{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.rt th{font-size:9.5px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
.rt td{padding:4px 3px;border-bottom:1px solid var(--border);vertical-align:middle}
.rt input,.rt select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px 6px;font-size:13px;font-family:inherit;min-width:0;background:#fff}
.rt input.calc{background:#F6F8FB;color:var(--primary);font-weight:800}
.rt input.warn{border-color:#E9A10C;background:#FFFBF0}
.rt input[type=time]{padding:8px 2px;font-size:12px}
.rt select{padding:8px 2px}
.rt .del{border:none;background:none;color:#B42318;font-size:18px;padding:4px}
.rt-wrap{overflow-x:auto;margin:0 -4px}
.addrow{margin-top:8px;border:1.5px dashed #C5CED9;background:#fff;color:var(--primary);font-weight:800;border-radius:10px;padding:10px;width:100%;font-size:13px}
/* ảnh */
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photo{position:relative;overflow:hidden;cursor:pointer;border:none}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .pend{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;border-radius:6px;padding:1px 5px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:none;background:#fff;font-size:20px;font-weight:800}
/* menu bên */
.side{position:fixed;top:0;bottom:0;left:0;width:86%;max-width:340px;background:#fff;z-index:61;overflow-y:auto;transform:translateX(-102%);transition:transform .22s;padding-bottom:30px;box-shadow:var(--shadow-lg)}
.side.on{transform:none}
.side-dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none}
.side-dim.on{display:block}
.side-top{background:var(--splash);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 18px}
.side-top .nm{font-size:17px;font-weight:800;margin-top:10px}
.side-top .rl{font-size:12px;opacity:.75;margin-top:3px;font-weight:600}
.sb-item{width:100%;border:none;background:none;text-align:left;color:var(--text)}
.sb-item:active{background:var(--bg)}
.sb-item small{margin-left:auto;color:var(--text3);font-size:11px;font-weight:700}
/* toast, loader */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1A2332;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:90;max-width:90%;box-shadow:var(--shadow-lg);text-align:center}
.loader{position:fixed;inset:0;background:rgba(11,27,51,.55);z-index:85;display:flex;align-items:center;justify-content:center}
.loader div{background:#fff;border-radius:14px;padding:16px 20px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center}
.spin{width:20px;height:20px;border:3px solid #E8ECF0;border-top-color:var(--orange);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* mặt bằng */

.cnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

<body>
<div id="app"></div>
<script>
// FECON South · THI CÔNG 1.0.0 — chạy cùng app Kho (đăng nhập ở index.html, dùng chung máy chủ Apps Script)
const KHO_VERSION = '5.31.0';
// ===== FECON Thi công 1.0 — lõi: máy chủ, lưu trên máy, hàng đợi gửi, điều hướng =====
const TC_APP_VERSION = '1.0.0';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6Rmi80I7RI3ij2U7RdRF5pYuQTnPrwEmGmUZS5xpxzLwwVynfoFUujZe1lm6HS1ymxw/exec';
const LS_TOKEN = 'fecon_token_v5', LS_USER = 'fecon_user_v5';           // dùng chung phiên đăng nhập với Kho
const LS_P = 'tc_proj', LS_BOOT = 'tc_boot2|', LS_OUT = 'tc_out_v1', LS_CA = 'tc_ca', LS_PART = 'fecon_part';
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsJ = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const uid = p => (p || 'R') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad2 = n => String(n).padStart(2, '0');
const fmtN = (v, dp) => { if (v === '' || v === null || v === undefined || isNaN(+v)) return '—'; const n = +v; return n.toLocaleString('vi-VN', { minimumFractionDigits: dp === undefined ? 0 : dp, maximumFractionDigits: dp === undefined ? 2 : dp }); };
const fmtZ = v => (v === '' || v === null || v === undefined || isNaN(+v)) ? '—' : ((+v > 0 ? '+' : +v < 0 ? '−' : '±') + Math.abs(+v).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const num = v => { if (v === '' || v === null || v === undefined) return NaN; return +String(v).replace(/\s/g, '').replace(',', '.'); };
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const dmy = s => s ? (+s.slice(8, 10)) + '/' + (+s.slice(5, 7)) + (s.slice(0, 4) !== String(new Date().getFullYear()) ? '/' + s.slice(0, 4) : '') : '';
const dayAdd = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const WD = ['CN','T2','T3','T4','T5','T6','T7'];

let token = lsGet(LS_TOKEN, ''), me = lsJ(LS_USER, null);
let P = lsGet(LS_P, '');
let B = null;                     // dữ liệu dự án: { tv, cfg, ck:[], recs:[], stats, users, projects, ckRev }
let CK = {};                      // mã → cấu kiện
let REC = {};                     // id → bản ghi (gần đây + đã tải theo cấu kiện)
let CKREC = {};                   // mã cấu kiện → { ids:[], at }
let outbox = lsJ(LS_OUT, []);
let online = navigator.onLine !== false;
let syncing = false, lastSync = 0, syncErr = '';
const VIEWS = {};
const hp = k => !!(me && (me.role === 'ADM' || (me.perm && me.perm[k])));

// ---------- Máy chủ ----------
async function api(action, data, ms) {
  if (navigator.onLine === false) return { success:false, offline:true, error:'Điện thoại đang không có mạng' };
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), ms || 30000);
  try {
    const res = await fetch(SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ action, data:data || {}, token }), redirect:'follow', signal:ctrl.signal });
    clearTimeout(tm);
    const text = await res.text();
    let r; try { r = JSON.parse(text); } catch (e) { return { success:false, offline:true, http:res.status, error:'Máy chủ Google trả lời không đúng (mã ' + res.status + ')' }; }
    if (r && r.auth) { authLost(r.error); }
    return r;
  } catch (e) {
    clearTimeout(tm);
    return { success:false, offline:true, error: e.name === 'AbortError' ? 'Máy chủ phản hồi quá lâu' : 'Không kết nối được máy chủ Google' };
  }
}
function authLost(msg) {
  try { localStorage.removeItem(LS_TOKEN); } catch (e) {}
  token = '';
  toast(msg || 'Phiên đăng nhập đã hết hạn');
  setTimeout(() => { location.href = 'index.html?login=1'; }, 1200);
}

// ---------- Dữ liệu dự án ----------
function setBoot(b, keepCk) {
  const old = B;
  B = b;
  if (!b.ck && old && old.ck) B.ck = old.ck;
  CK = {};
  (B.ck || []).forEach(c => { CK[c[0]] = ckObj(c); });
  REC = {};
  (B.recs || []).forEach(r => REC[r.id] = r);
  Object.values(CKREC).forEach(x => (x.recs || []).forEach(r => { if (!REC[r.id]) REC[r.id] = r; }));
  applyOutboxLocal();
}
function ckObj(c) {
  const m = c[10] || {};
  return { code:c[0], loai:c[1], type:c[2], x:c[3], y:c[4], kv:c[5], truc:c[6], st:c[7] || 'cl', step:c[8] || '', flag:c[9] || '', m:m };
}
function saveBoot() {
  if (!B || !P) return;
  const keep = Object.assign({}, B, { recs:(B.recs || []).slice(0, 1500) });
  if (!lsSet(LS_BOOT + P, JSON.stringify(keep))) {
    Object.keys(localStorage).filter(k => k.indexOf(LS_BOOT) === 0 && k !== LS_BOOT + P).forEach(k => localStorage.removeItem(k));
    lsSet(LS_BOOT + P, JSON.stringify(keep));
  }
}
function loadCachedBoot() {
  const b = lsJ(LS_BOOT + P, null);
  if (b && b.ck) { setBoot(b); return true; }
  return false;
}
async function sync(force) {
  if (syncing || !token) return;
  syncing = true; setSync();
  try {
    await flushOut();
    if (!force && B && B.tv) {
      const v = await api('tcVer', { project:P }, 15000);
      if (v.success && v.tv === B.tv && !outbox.length) { lastSync = Date.now(); syncErr = ''; return; }
    }
    const r = await api('tcBoot', { project:P, ckRev: B && B.ck ? B.ckRev : '' }, 45000);
    if (r.success) {
      if (r.project !== P) { P = r.project; lsSet(LS_P, P); }
      if (r.me) { me = r.me; lsSet(LS_USER, JSON.stringify(me)); }
      setBoot(r); saveBoot(); lastSync = Date.now(); syncErr = '';
      Object.keys(CKREC).forEach(k => { if (CKREC[k].tv !== r.tv) CKREC[k].stale = 1; });
      if (!force) rerender();
    } else if (r.forbidden) { syncErr = r.error; }
    else syncErr = r.error || 'Lỗi tải dữ liệu';
  } finally { syncing = false; setSync(); }
}
async function loadCk(code, quiet) {
  const c = CKREC[code];
  if (c && !c.stale && Date.now() - c.at < 60000) return c;
  if (!quiet) showLoader('Đang tải hồ sơ ' + code + '…');
  const r = await api('tcCk', { project:P, code });
  if (!quiet) hideLoader();
  if (r.success) {
    CKREC[code] = { recs:r.recs, photos:r.photos || [], at:Date.now(), tv:r.tv };
    r.recs.forEach(x => REC[x.id] = x);
    applyOutboxLocal();
    return CKREC[code];
  }
  if (!quiet && !r.offline) toast(r.error || 'Không tải được hồ sơ');
  return CKREC[code] || null;
}
// bản ghi của 1 cấu kiện (đã tải + gần đây + chờ gửi)
function recsOf(code, mod) {
  return Object.values(REC).filter(r => (r.ck === code || (r.mod === 'xe' && (r.d.pb || []).some(x => x && x.ck === code))) && (!mod || r.mod === mod) && r.st !== 'huy')
    .sort((a, b) => (a.ngay + (a.at || '')).localeCompare(b.ngay + (b.at || '')) );
}
const lastOf = (code, mod) => { const l = recsOf(code, mod); return l.length ? l[l.length - 1] : null; };
function photosOf(recId) {
  const out = [];
  Object.values(CKREC).forEach(c => (c.photos || []).forEach(p => { if (p.recId === recId) out.push(p); }));
  outbox.filter(o => o.action === 'tcPhoto' && o.data.recId === recId).forEach(o => out.push({ id:o.data.photoId, local:o.data.data, pend:1 }));
  return out;
}

// ---------- Hàng đợi gửi (mất mạng vẫn lưu) ----------
function saveOut() { if (!lsSet(LS_OUT, JSON.stringify(outbox))) toast('⚠️ Bộ nhớ máy đầy — gửi bớt ảnh khi có mạng'); }
function queue(action, data, apply) {
  const item = { op:uid('O'), action, data:Object.assign({ project:P }, data), t:Date.now() };
  item.data.op = item.op;
  outbox.push(item); saveOut();
  applyOutboxLocal();
  setSync();
  flushOut();
  return item;
}
function applyOutboxLocal() {
  outbox.forEach(o => {
    if (o.action === 'tcSave') {
      const r0 = o.data.rec, cur = REC[r0.id];
      const st = r0.submit ? 'gui' : (cur ? cur.st : (r0.mod === 'sk' ? 'mo' : 'nhap'));
      REC[r0.id] = Object.assign({}, cur || { by:me.id, byName:me.name, at:'', sign:[], rev:0 }, { id:r0.id, ck:r0.ck || '', mod:r0.mod, d:r0.d, ngay:r0.ngay, st, _pend:1 });
    } else if (o.action === 'tcSign') {
      const cur = REC[o.data.id]; if (cur) { cur.st = { xn:'xn', tra:'tra', duyet:'duyet', dong:'dong', mo:'mo', huy:'huy', gui:'gui' }[o.data.act] || cur.st; cur._pend = 1; }
    } else if (o.action === 'tcDel') { delete REC[o.data.id]; }
  });
}
let flushing = null;
function flushOut() {
  if (flushing) return flushing;
  const p = (async () => {
    await null;
    while (outbox.length && navigator.onLine !== false) {
      const it = outbox[0];
      const r = await api(it.action, it.data, it.action === 'tcPhoto' ? 90000 : 30000);
      if (r.offline) { syncErr = r.error; break; }
      outbox.shift(); saveOut();
      if (!r.success) {
        toast('❌ ' + (r.error || 'Máy chủ từ chối') + (it.data.rec ? ' · ' + (MODS[it.data.rec.mod] || {}).t : ''), 6000);
        if (it.action === 'tcSave' && REC[it.data.rec.id] && REC[it.data.rec.id]._pend && !REC[it.data.rec.id].rev) delete REC[it.data.rec.id];
        continue;
      }
      if (r.rec) { REC[r.rec.id] = r.rec; const c = CKREC[r.rec.ck]; if (c) { const i = c.recs.findIndex(x => x.id === r.rec.id); if (i >= 0) c.recs[i] = r.rec; else c.recs.push(r.rec); } }
      if (r.conflict) toast('⚠️ Bản ghi vừa được sửa trên máy khác — đã giữ cả hai để đối chiếu', 6000);
      if (r.ck && CK[r.ck.code]) Object.assign(CK[r.ck.code], { st:r.ck.st, step:r.ck.step, flag:r.ck.flag });
      if (it.action === 'tcDel') Object.values(CKREC).forEach(c => { c.recs = c.recs.filter(x => x.id !== it.data.id); });
      if (it.action === 'tcPhoto' && r.fileId) { const c = Object.values(CKREC).find(c => c.recs.some(x => x.id === it.data.recId)); if (c) c.photos.push({ id:it.data.photoId, recId:it.data.recId, fileId:r.fileId, byName:me.name, at:'' }); PHC[r.fileId] = it.data.data; }
      if (r.tv && B) B.tv = r.tv - 0.5;                       // còn thay đổi của người khác → lần đồng bộ sau tải lại
    }
  })().catch(e => { syncErr = String(e && e.message || e); }).finally(() => { if (flushing === p) flushing = null; setSync(); rerenderSoft(); });
  flushing = p;
  return p;
}
window.addEventListener('online', () => { online = true; setSync(); sync(); });
window.addEventListener('offline', () => { online = false; setSync(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSync > 15000) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 25000);

// ---------- Ca làm việc ----------
function caNow() {
  const c = lsJ(LS_CA, {}), d = new Date();
  const h = d.getHours() + d.getMinutes() / 60;
  const night = h >= 19 || h < 7;
  const day = h < 7 ? ymd(new Date(d.getTime() - 864e5)) : ymd(d);   // ca đêm qua 0:00 vẫn tính ngày bắt đầu ca
  return { ngay:day, dem:c.auto === false ? !!c.dem : night, kv:c.kv || '' };
}
const today = () => caNow().ngay;

// ---------- Điều hướng ----------
let stack = [];                  // [{v, a}]
let cur = { v:'home', a:{} };
const TABS = { home:1, plan:1, viec:1, vt:1, bc:1 };
function go(v, a, replace) {
  if (replace) stack.pop();
  if (TABS[v]) stack = [];
  else stack.push(cur);
  cur = { v, a:a || {} };
  try { history.pushState({ n:stack.length }, ''); } catch (e) {}
  render(true);
}
function back() {
  if (closeOverlays()) return;
  if (!stack.length) { cur = { v:'home', a:{} }; render(true); return; }
  cur = stack.pop(); render(true);
}
window.addEventListener('popstate', () => { if (closeOverlays()) { try { history.pushState({}, ''); } catch (e) {} return; } if (stack.length) { cur = stack.pop(); render(true); } else if (cur.v !== 'home') { cur = { v:'home', a:{} }; render(true); } });
function closeOverlays() {
  if ($('.viewer')) { $('.viewer').remove(); return true; }
  if ($('#sheet')) { closeSheet(); return true; }
  if ($('.side.on')) { sideOff(); return true; }
  return false;
}
let scrollKeep = {};
function rerender() { if ($('#sheet') || document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { setSync(); return; } const m = $('.main'); const y = m ? m.scrollTop : 0; render(false); const m2 = $('.main'); if (m2) m2.scrollTop = y; }

function shell(o) {        // o: {title, sub, back, body, act, tab, noSync}
  const tabs = [['home','🏠','Tổng quan'],['plan','🗺️','Cấu kiện'],['viec','✅','Việc'],['vt','📦','Vật tư'],['bc','📊','Báo cáo']];
  const nv = taskCount();
  const head = o.back
    ? `<div class="dhdr"><button class="back" onclick="back()" aria-label="Quay lại">‹</button><div class="dtitle">${o.title}${o.sub ? `<div class="dsub">${o.sub}</div>` : ''}</div>${o.right || ''}</div>`
    : `<div class="hdr"><button class="hdr-menu" onclick="sideOn()" aria-label="Menu"><span></span><span></span><span></span></button>
        <div class="hdr-mid"><img class="hdr-logo" src="${LOGO}" alt="FECON South"><div class="hdr-mod">Thi công</div></div>
        <div class="hdr-right"><div class="hdr-ava tap" onclick="sideOn()">${esc(initials(me && me.name))}</div></div></div>`;
  return `<div class="scr">${head}${o.noSync ? '' : '<div id="syncbar"></div>'}${demoBar()}
    <div class="main" id="main">${o.body}</div>
    ${o.act ? `<div class="actbar">${o.act}</div>` : ''}
    ${o.back && !o.tabs ? '' : `<div class="bnav">${tabs.map(t => `<button class="bn ${o.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><span class="bi">${t[1]}${t[0] === 'viec' && nv ? `<span class="bb">${nv}</span>` : ''}</span>${t[2]}</button>`).join('')}</div>`}</div>`;
}
function demoBar() { return B && B.cfg && B.cfg.demo && B.cfg.demo.on ? '<div class="demo">🧪 Dữ liệu mẫu để tập — ghi thoải mái</div>' : ''; }
const initials = n => String(n || '?').trim().split(/\s+/).slice(-2).map(x => x[0]).join('').toUpperCase();
function setSync() {
  const el = $('#syncbar'); if (!el) return;
  const n = outbox.length;
  let cls = 'ok', t;
  if (navigator.onLine === false) { cls = 'wait'; t = `Không có mạng · ${n ? n + ' thao tác lưu trên máy, tự gửi khi có mạng' : 'đang xem dữ liệu đã lưu'}`; }
  else if (syncing || flushing) { cls = 'wait'; t = n ? `Đang gửi ${n} thao tác…` : 'Đang đồng bộ…'; }
  else if (syncErr) { cls = 'err'; t = syncErr + (n ? ` · ${n} thao tác chờ gửi` : ''); }
  else if (n) { cls = 'wait'; t = `${n} thao tác chờ gửi`; }
  else t = lastSync ? `Đã đồng bộ ${new Date(lastSync).toTimeString().slice(0, 5)}` : 'Dữ liệu trên máy';
  el.className = 'sync ' + cls; el.innerHTML = `<span class="dot"></span>${esc(t)}${cls === 'err' || n ? ' <a class="tap" style="margin-left:auto;text-decoration:underline" onclick="sync(true)">Thử lại</a>' : ''}`;
}
function toast(msg, ms) {
  $$('.toast').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), ms || 2800);
}
function showLoader(msg) { hideLoader(); const d = document.createElement('div'); d.className = 'loader'; d.id = 'loader'; d.innerHTML = `<div><span class="spin"></span>${esc(msg || 'Đang tải…')}</div>`; document.body.appendChild(d); }
function hideLoader() { const l = $('#loader'); if (l) l.remove(); }
function sheet(html, onClose) {
  closeSheet();
  const d = document.createElement('div'); d.id = 'sheet';
  d.innerHTML = `<div class="dim" onclick="closeSheet()"></div><div class="sheet"><div class="handle"></div>${html}</div>`;
  d._onClose = onClose;
  document.body.appendChild(d);
  try { history.pushState({ sheet:1 }, ''); } catch (e) {}
}
function closeSheet() { const s = $('#sheet'); if (s) { if (s._onClose) s._onClose(); s.remove(); } }
function ask(title, opts) {             // hộp hỏi: opts {msg, input, ok, okCls, cancel, def}
  return new Promise(res => {
    sheet(`<div class="fsec-t" style="border:none;padding:0;margin-bottom:8px">${esc(title)}</div>${opts.msg ? `<div class="small" style="font-size:13px;color:var(--text2);margin-bottom:12px">${opts.msg}</div>` : ''}
      ${opts.input ? `<div class="fg"><textarea id="ask-in" placeholder="${esc(opts.input)}">${esc(opts.def || '')}</textarea></div>` : ''}
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" id="ask-no">${esc(opts.cancel || 'Thôi')}</button><button class="btn ${opts.okCls || ''}" id="ask-ok">${esc(opts.ok || 'Đồng ý')}</button></div>`, () => res(null));
    $('#ask-no').onclick = () => { $('#sheet')._onClose = null; closeSheet(); res(null); };
    $('#ask-ok').onclick = () => { const v = opts.input ? $('#ask-in').value.trim() : true; if (opts.input && opts.need && !v) { toast('Nhập ' + opts.input.toLowerCase()); return; } $('#sheet')._onClose = null; closeSheet(); res(v); };
    if (opts.input) setTimeout(() => $('#ask-in') && $('#ask-in').focus(), 150);
  });
}

function sideOn() {
  let s = $('#side');
  if (!s) { s = document.createElement('div'); document.body.appendChild(s); }
  s.outerHTML = `<div id="side-wrap"><div class="side-dim on" onclick="sideOff()"></div><div class="side" id="side">${sideHtml()}</div></div>`;
  requestAnimationFrame(() => $('#side').classList.add('on'));
}
function sideOff() { const w = $('#side-wrap'); if (w) w.remove(); }

const dmmN = (a, b) => (num(a) - num(b)) * 1000;

  let note = '';
  if (act === 'tra') { note = await ask('Trả về hồ sơ', { input:'Lý do trả về', need:1, ok:'Trả về', okCls:'rd' }); if (!note) return; }
  else if (act === 'phanhoi') { note = await ask('Phản hồi', { input:'Nội dung', need:1, ok:'Gửi' }); if (!note) return; }
  else if (act === 'huy') { if (!(await ask('Hủy bản ghi này?', { msg:'Bản ghi đã gửi không xóa được — hủy để giữ lịch sử.', ok:'Hủy bản ghi', okCls:'rd' }))) return; }
  else if (act === 'xn' && F.mod === 'truoc') { if (!(await ask('Giải phóng điểm Hold?', { msg:'Xác nhận đủ điều kiện đổ bê tông cho ' + esc(F.code) + '.', ok:'Giải phóng Hold', okCls:'gr' }))) return; }
  else if (act === 'duyet') { if (!(await ask('Duyệt nội bộ hồ sơ nghiệm thu ' + F.code + '?', { ok:'Duyệt', okCls:'nv' }))) return; }
  else if (act === 'dong') { note = await ask('Đóng ' + (r.d.so || 'sự kiện'), { input:'Căn cứ đóng (biên bản, phản hồi TVGS…)', ok:'Đóng' }); if (note === null) return; }
  queue('tcSign', { id:r.id, act, note:note === true ? '' : note || '' });
  toast({ xn:'✅ Đã xác nhận', tra:'↩ Đã trả về', duyet:'🏁 Đã duyệt', dong:'Đã đóng', mo:'Đã mở lại', huy:'Đã hủy', nhan:'🤝 Đã nhận ca', phanhoi:'💬 Đã gửi phản hồi' }[act] || 'Đã lưu');
  F = null; back();
}
async function fDel() {
  if (!(await ask('Xóa bản ghi?', { ok:'Xóa', okCls:'rd' }))) return;
  queue('tcDel', { id:F.rec.id }); F = null; back();
}

function boqDone(row) {
  const loai = row[4], f = row[5];
  const l = Object.values(CK).filter(c => (loai === 'tv' ? c.loai === 'tv' : c.loai !== 'tv'));
  const nt = l.filter(c => c.st === 'nt'), dd = l.filter(c => c.st === 'dd' || c.st === 'nt');
  const val = list => { if (!f) return l.length ? (+row[3] || 0) * list.length / l.length : 0; return list.reduce((s, c) => { const z = dz(c); return s + (f === 'L' ? z.Lk : f === 'thep' ? (+c.m.thep || 0) : f === 'v' ? z.vlt : f === 'vd' ? (z.L * z.t * z.Lk) : 0); }, 0); };
  return { nt:val(nt), dd:val(dd), est:!f };
}

const nk = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '');
async function ckImport(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  showLoader('Đang đọc file…');
  let rows = [];
  try {
    if (/\.xlsx$/i.test(f.name)) {
      const X = await loadXL(); const wb = new X.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
      const ws = wb.worksheets[0];
      ws.eachRow({ includeEmpty:false }, r => rows.push(r.values.slice(1).map(v => v && typeof v === 'object' ? (v.result !== undefined ? v.result : v.text || '') : v)));
    } else {
      const t = await f.text(); const sep = t.indexOf('\t') >= 0 ? '\t' : t.split('\n')[0].indexOf(';') >= 0 ? ';' : ',';
      rows = t.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(x => x.trim().replace(/^"|"$/g, '')));
    }
  } catch (e) { hideLoader(); toast('Không đọc được file: ' + e.message); return; }
  hideLoader();
  if (rows.length < 2) { toast('File không có dữ liệu'); return; }
  const head = rows[0].map(nk), idx = {};
  CK_COLS.forEach(c => { const want = nk(c[1]); let i = head.indexOf(want); if (i < 0) i = head.findIndex(h => h && (h === nk(c[0]) || h.indexOf(nk(c[1].split(' (')[0])) === 0)); if (i >= 0) idx[c[0]] = i; });
  if (idx.code === undefined) { toast('Không thấy cột "Mã"'); return; }
  const g = (r, k) => idx[k] === undefined ? '' : r[idx[k]];
  const nv = (r, k) => { const v = num(g(r, k)); return isFinite(v) ? v : undefined; };
  const out = [], err = [];
  rows.slice(1).forEach((r, i) => {
    const code = String(g(r, 'code') || '').trim(); if (!code) return;
    const lt = nk(g(r, 'loai'));
    const loai = /panel|tuong|tv/.test(lt) ? 'tv' : /thu|tp/.test(lt) ? 'tp' : 'coc';
    const meta = {};
    ['d', 'gl', 'col', 'toe', 'v', 'thep', 'nLong', 't', 'top', 'gTop', 'gBot'].forEach(k => { const v = nv(r, k); if (v !== undefined) meta[k] = v; });
    if (g(r, 'bv')) meta.bv = String(g(r, 'bv'));
    let x = nv(r, 'x'), y = nv(r, 'y');
    if (loai === 'tv') {
      const a = [nv(r, 'ax'), nv(r, 'ay')], b = [nv(r, 'bx'), nv(r, 'by')];
      if (a.concat(b).every(v => v !== undefined)) { meta.a = a; meta.b = b; meta.L = Math.round(Math.hypot(a[0] - b[0], a[1] - b[1]) * 1000) / 1000; x = (a[0] + b[0]) / 2; y = (a[1] + b[1]) / 2; }
      else err.push(`Dòng ${i + 2} (${code}): panel thiếu tọa độ 2 đầu A, B`);
      meta.k = String(g(r, 'k') || g(r, 'type') || '');
    }
    if (loai !== 'tv' && (x === undefined || y === undefined)) err.push(`Dòng ${i + 2} (${code}): thiếu X, Y`);
    out.push({ code, loai, type:String(g(r, 'type') || ''), x, y, kv:String(g(r, 'kv') || ''), truc:String(g(r, 'truc') || ''), meta });
  });
  const box = $('#imp-res');
  if (err.length) { box.innerHTML = `<div class="note n-err">❌<span>${err.slice(0, 8).map(esc).join('<br>')}${err.length > 8 ? '<br>… và ' + (err.length - 8) + ' lỗi khác' : ''}</span></div>`; return; }
  const n = l => out.filter(c => c.loai === l).length;
  box.innerHTML = `<div class="note n-info">📋<span>Đọc được <b>${out.length}</b> cấu kiện: ${n('coc')} cọc · ${n('tp')} cọc thử · ${n('tv')} panel. Thiếu cột: ${CK_COLS.filter(c => idx[c[0]] === undefined).map(c => c[1]).slice(0, 6).join(', ') || 'không'}${CK_COLS.filter(c => idx[c[0]] === undefined).length > 6 ? '…' : ''}</span></div><button class="btn mt8" id="imp-go">Nạp ${out.length} cấu kiện (${(cur.a.mode || 'them') === 'thay' ? 'thay toàn bộ' : 'thêm / cập nhật'})</button>`;
  $('#imp-go').onclick = async () => {
    showLoader('Đang nạp…');
    const r = await api('tcImportCk', { project:P, rows:out, mode:cur.a.mode || 'them' }, 180000); hideLoader();
    if (!r.success) { box.innerHTML = `<div class="note n-err">❌<span>${esc(r.error)}</span></div>`; return; }
    toast(`Đã nạp ${r.n} cấu kiện · dự án có ${r.total}`); B.ckRev = ''; GEO = null; await sync(true); render(false);
  };
}
