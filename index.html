<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F6FA;
  --white:#FFFFFF;
  --navy:#0B1F3A;
  --navy2:#1A3358;
  --blue:#1565C0;
  --blue-light:#E8F0FE;
  --orange:#E65100;
  --orange-light:#FFF3E0;
  --green:#2E7D32;
  --green-light:#E8F5E9;
  --red:#C62828;
  --red-light:#FFEBEE;
  --yellow:#F57F17;
  --yellow-light:#FFFDE7;
  --gray1:#F5F6FA;
  --gray2:#ECEFF1;
  --gray3:#B0BEC5;
  --gray4:#78909C;
  --text:#1A2332;
  --text2:#4A5568;
  --border:#DDE3EC;
  --radius:14px;
  --shadow:0 2px 12px rgba(11,31,58,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ====== LOGIN ====== */
#login-screen{
  min-height:100vh;
  background:linear-gradient(160deg,#0B1F3A 0%,#1A3358 60%,#1565C0 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
}
.login-logo{text-align:center;margin-bottom:36px}
.login-logo .badge{
  display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.7);font-size:10px;letter-spacing:2px;padding:4px 12px;border-radius:20px;
  text-transform:uppercase;margin-bottom:14px
}
.login-logo h1{font-size:28px;font-weight:800;color:#fff;line-height:1.1;margin-bottom:6px}
.login-logo p{font-size:13px;color:rgba(255,255,255,.5)}
.login-card{
  background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,.25)
}
.role-tabs{display:flex;background:var(--gray1);border-radius:10px;padding:4px;gap:4px;margin-bottom:22px}
.role-tab{
  flex:1;padding:9px 6px;border:none;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--gray4);background:transparent;cursor:pointer;transition:.2s
}
.role-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.user-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.avatar{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0
}
.avatar.tk{background:var(--navy2)}
.avatar.ql{background:var(--blue)}
.user-info .uname{font-weight:700;font-size:14px}
.user-info .urole{font-size:11px;color:var(--gray4);margin-top:1px}
.dots-row{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:.15s}
.dot.on{background:var(--navy);border-color:var(--navy)}
.dot.err{background:var(--red);border-color:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kbtn{
  height:56px;border:none;border-radius:12px;background:var(--gray1);
  font-size:20px;font-weight:500;color:var(--text);cursor:pointer;transition:.1s;
  display:flex;align-items:center;justify-content:center
}
.kbtn:active{background:var(--gray2)}
.kbtn.ghost{background:transparent;cursor:default}
.kbtn.del{font-size:14px;color:var(--text2)}
.pin-err{text-align:center;color:var(--red);font-size:12px;margin-top:8px;min-height:18px}
.pin-hint{text-align:center;font-size:11px;color:var(--gray3);margin-top:6px}

/* ====== APP SHELL ====== */
#app{display:none;min-height:100vh;padding-bottom:72px}
.topbar{
  background:var(--navy);padding:14px 16px 10px;position:sticky;top:0;z-index:200
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.topbar-brand{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.5);text-transform:uppercase}
.topbar-title{font-size:18px;font-weight:800;color:#fff}
.topbar-right{display:flex;align-items:center;gap:8px}
.sync-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px}
.sync-ok{background:#1B5E20;color:#A5D6A7}
.sync-err{background:#7F1D1D;color:#FFCDD2}
.sync-ing{background:#0D47A1;color:#90CAF9}
.exit-btn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.7);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer
}
.proj-bar{
  background:rgba(255,255,255,.07);border-radius:10px;padding:8px 12px;
  display:flex;align-items:center;gap:8px
}
.proj-label{font-size:10px;color:var(--orange);font-weight:700;letter-spacing:.5px;white-space:nowrap}
.proj-sel{
  background:none;border:none;color:#fff;font-size:13px;font-weight:600;
  flex:1;outline:none;cursor:pointer
}
.proj-sel option{background:var(--navy);color:#fff}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;border-top:1px solid var(--border);
  display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 4px 8px;cursor:pointer;border:none;background:none;
  color:var(--gray3);font-size:10px;font-weight:600;gap:3px;transition:.15s
}
.bnav-item.active{color:var(--navy)}
.bnav-icon{font-size:20px}

/* ====== CONTENT ====== */
.content{padding:14px 14px 0}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:14px 14px 12px;
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--navy)
}
.stat-card.green::before{background:var(--green)}
.stat-card.red::before{background:var(--red)}
.stat-card.orange::before{background:var(--orange)}
.stat-card .s-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.stat-card .s-val{font-size:24px;font-weight:800;color:var(--navy);line-height:1}
.stat-card .s-sub{font-size:11px;color:var(--gray4);margin-top:4px}

/* section */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:14px;font-weight:700;color:var(--navy)}
.btn-primary{
  background:var(--navy);color:#fff;border:none;border-radius:8px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px
}
.btn-orange{background:var(--orange)}
.btn-green{background:var(--green)}
.btn-blue{background:var(--blue)}
.btn-gray{background:var(--gray4)}

/* card list */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-head{
  background:var(--navy);color:#fff;padding:10px 14px;
  font-size:11px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px
}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
table.data-table th{
  background:var(--navy2);color:rgba(255,255,255,.85);padding:9px 12px;
  text-align:left;font-size:11px;font-weight:600
}
table.data-table td{padding:10px 12px;border-bottom:1px solid var(--gray2);vertical-align:middle}
table.data-table tr:last-child td{border-bottom:none}
table.data-table tr:hover td{background:#F8FAFC}

/* badge */
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.b-green{background:var(--green-light);color:var(--green)}
.b-red{background:var(--red-light);color:var(--red)}
.b-yellow{background:var(--yellow-light);color:var(--yellow)}
.b-blue{background:var(--blue-light);color:var(--blue)}
.b-navy{background:#E8EDF5;color:var(--navy)}

/* action buttons */
.act-row{display:flex;gap:5px}
.act-btn{border:none;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer}
.a-edit{background:var(--blue-light);color:var(--blue)}
.a-del{background:var(--red-light);color:var(--red)}

/* forms */
.form-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.form-card h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:14px;
  padding-bottom:10px;border-bottom:2px solid var(--navy);display:flex;align-items:center;gap:8px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:14px;color:var(--text);background:#fff;outline:none;font-family:inherit;transition:.2s
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-full{
  width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;
  cursor:pointer;color:#fff;background:var(--navy);margin-top:4px
}

/* chip filter */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;
  border:1.5px solid var(--border);color:var(--text2);cursor:pointer;background:#fff;transition:.15s
}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chart-box{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.chart-box.full{grid-column:1/-1}
.chart-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:10px}
.chart-wrap{position:relative;height:160px}
.chart-wrap-tall{position:relative;height:200px}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;
  display:flex;align-items:flex-end;justify-content:center
}
.modal{
  background:#fff;border-radius:20px 20px 0 0;padding:20px;
  width:100%;max-height:88vh;overflow-y:auto
}
.modal h3{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.btn-cancel{flex:1;background:var(--gray1);color:var(--text2);border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ok{flex:1;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}

/* toast */
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;
  font-size:13px;z-index:999;display:none;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.25)
}
.toast.show{display:block}

/* loading */
.loader{
  position:fixed;inset:0;background:rgba(11,31,58,.8);z-index:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px
}
.spinner{
  width:36px;height:36px;border:3px solid rgba(255,255,255,.2);
  border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite
}
.loader p{color:rgba(255,255,255,.75);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}

.info-note{
  background:var(--blue-light);border-left:3px solid var(--blue);border-radius:8px;
  padding:10px 13px;font-size:12px;color:#1A3358;margin-bottom:12px;line-height:1.5
}
.warn-note{
  background:var(--orange-light);border-left:3px solid var(--orange);border-radius:8px;
  padding:10px 13px;font-size:12px;color:#7B2D00;margin-bottom:12px
}
.empty{text-align:center;padding:32px;color:var(--gray4);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">
    <div class="badge">Fecon South</div>
    <h1>Quản Lý<br>Kho Vật Tư</h1>
    <p>DA TTHC Quận 2</p>
  </div>
  <div class="login-card">
    <div class="role-tabs">
      <button class="role-tab active" onclick="pickRole('tk')" id="rtab-tk">🏗️ Thủ Kho</button>
      <button class="role-tab" onclick="pickRole('ql')" id="rtab-ql">👔 Quản Lý</button>
    </div>
    <div class="user-row">
      <div class="avatar tk" id="lg-av">TK</div>
      <div class="user-info">
        <div class="uname" id="lg-name">Thủ Kho</div>
        <div class="urole" id="lg-role">Nhập · Xuất kho</div>
      </div>
    </div>
    <div class="dots-row">
      <div class="dot" id="dot0"></div><div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div><div class="dot" id="dot3"></div>
    </div>
    <div class="keypad">
      <button class="kbtn" onclick="kp('1')">1</button>
      <button class="kbtn" onclick="kp('2')">2</button>
      <button class="kbtn" onclick="kp('3')">3</button>
      <button class="kbtn" onclick="kp('4')">4</button>
      <button class="kbtn" onclick="kp('5')">5</button>
      <button class="kbtn" onclick="kp('6')">6</button>
      <button class="kbtn" onclick="kp('7')">7</button>
      <button class="kbtn" onclick="kp('8')">8</button>
      <button class="kbtn" onclick="kp('9')">9</button>
      <button class="kbtn ghost"></button>
      <button class="kbtn" onclick="kp('0')">0</button>
      <button class="kbtn del" onclick="kpDel()">⌫</button>

// ===== SYNC =====
function isConfigured() { return SCRIPT_URL && SCRIPT_URL !== 'GOOGLE_SCRIPT_URL'; }
function setSyncChip(state, txt) {
  const el = document.getElementById('sync-chip');
  el.className = 'sync-chip sync-' + state;
  el.textContent = txt;
}
function callServer(params) {
  if (!isConfigured()) return Promise.resolve({ success:false });
  return new Promise(resolve => {
    const cb = '_cb' + Date.now();
    const s = document.createElement('script');
    window[cb] = r => { try{document.head.removeChild(s)}catch(e){} delete window[cb]; resolve(r); };
    s.onerror = () => resolve({ success:false });
    const qs = Object.entries(params).map(([k,v]) => k+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v)).join('&');
    s.src = SCRIPT_URL + '?' + qs + '&callback=' + cb + '&t=' + Date.now();
    document.head.appendChild(s);
  });
}
async function syncAll() {
  if (!isConfigured()) { setSyncChip('err','⚠️ Offline'); return; }
  setSyncChip('ing','⏳ Đang tải...');
  const r = await callServer({ action:'getAll' });
  if (r.success && r.items?.length) {
    db.items = r.items.map(i => ({ ...i, id:+i.id, stock:+i.stock, minStock:+i.minStock }));
    db.transactions = (r.transactions||[]).map(t => ({ ...t, itemId:+t.itemId, qty:+t.qty }));
    setSyncChip('ok','✅ Đã sync');
  } else {
    setSyncChip('err','❌ Offline');
  }
}
async function pushTxn(txn) {
  setSyncChip('ing','⏳ Đang lưu...');
  const r = await callServer({ action:'addTransaction', data:txn });
  setSyncChip(r.success ? 'ok' : 'err', r.success ? '✅ Đã lưu' : '❌ Lỗi lưu');
}
async function pushItems() {
  setSyncChip('ing','⏳ Đang lưu...');
  const r = await callServer({ action:'updateItems', data:{ items:db.items } });
  setSyncChip(r.success ? 'ok' : 'err', r.success ? '✅ Đã lưu' : '❌ Lỗi lưu');
}

  else if (tab==='admin') renderAdmin(c);
}

    const d = (t.datetime||'').split(' ')[0] || t.datetime || '';
    nhapByDay[d] = (nhapByDay[d]||0) + t.qty;

  c.innerHTML = `
    ${!isConfigured() ? `<div class="warn-note" style="margin-top:0">⚠️ Chưa kết nối Google Sheets — dữ liệu lưu tạm, mất khi đóng app.</div>` : ''}

      <div class="stat-card red"><div class="s-label">Phiếu xuất</div><div class="s-val">${xuatCnt}</div><div class="s-sub">${curProj==='all'?'Tất cả':curProj}</div></div>
    </div>

    <div class="chart-grid">
      <div class="chart-box">
        <div class="chart-title">🛢️ Tỉ lệ xuất theo vật tư</div>
        <div class="chart-wrap"><canvas id="chart-pie"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">📦 Tồn kho hiện tại</div>
        <div class="chart-wrap"><canvas id="chart-stock"></canvas></div>
      </div>
      <div class="chart-box full">
        <div class="chart-title">📅 Nhập kho theo ngày</div>
        <div class="chart-wrap-tall"><canvas id="chart-bar"></canvas></div>
      </div>
    </div>

    <div class="sec-head"><div class="sec-title">⚠️ Vật tư cần bổ sung</div></div>
    <div class="card">
      <table class="data-table">
        <thead><tr><th>Vật tư</th><th>Tồn kho</th><th>Tối thiểu</th></tr></thead>
        <tbody>
          ${si.filter(i=>i.stock<=i.minStock).map(i=>`<tr>
            <td>${i.name}</td>
            <td><span class="badge b-red">${i.stock} ${i.unit}</span></td>
            <td>${i.minStock} ${i.unit}</td>
          </tr>`).join('') || '<tr><td colspan="3" class="empty">✅ Tất cả vật tư đủ hàng</td></tr>'}
        </tbody>
      </table>
    </div>

    <div class="sec-head"><div class="sec-title">🕐 Giao dịch gần nhất</div></div>
    <div class="card">
      <table class="data-table">
        <thead><tr><th>Vật tư</th><th>Loại</th><th>SL</th><th>Dự án</th></tr></thead>

          ${txns.slice(-6).reverse().map(t => {

async function doXuat() {
  const itemId = +document.getElementById('fx-item').value;
  const qty = +document.getElementById('fx-qty').value;
  const proj = document.getElementById('fx-proj').value;
  const tb = document.getElementById('fx-thietbi').value;
  if (!qty||qty<=0) { toast('⚠️ Nhập số lượng hợp lệ'); return; }
  const item = db.items.find(i=>i.id===itemId);
  if (!item) return;
  if (!MACHINE_CATS.includes(item.cat) && qty>item.stock) {
    toast(`❌ Tồn kho không đủ! Còn ${item.stock} ${item.unit}`); return;
  }
  if (!MACHINE_CATS.includes(item.cat)) {
    item.stock = Math.round((item.stock-qty)*100)/100;
  }
  const txn = {
    id:Date.now(), type:'xuat', itemId, itemName:item.name,
    qty, unit:item.unit, project:proj,
    supplierOrReceiver: tb || document.getElementById('fx-note').value,
    thietBi: tb,
    note: document.getElementById('fx-note').value,
    datetime: new Date().toLocaleString('vi-VN')
  };
  db.transactions.push(txn);
  showLoader('Đang lưu...');
  await pushTxn(txn);
  hideLoader();
  toast(`✅ Xuất ${qty} ${item.unit} ${item.name}${tb?' → '+tb:''}`);
  renderXuat(document.getElementById('main-content'));
}

// ===== EXPORT EXCEL =====
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Sheet 1: Giao dịch
  const txnRows = [['ID','Loại','Vật tư','SL','Đơn vị','Dự án','NCC/Thiết bị','Ghi chú','Thời gian']];
  db.transactions.forEach(t => {
    const item = db.items.find(i=>i.id===t.itemId);
    txnRows.push([t.id, t.type==='nhap'?'Nhập':'Xuất', item?.name||t.itemName, t.qty, item?.unit||t.unit,
      t.project, t.supplierOrReceiver||t.thietBi||'', t.note||'', t.datetime||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txnRows), 'Giao dịch');

  // Sheet 2: Tồn kho
  const stockRows = [['STT','Tên vật tư','Nhóm','Đơn vị','Tồn kho','Tối thiểu','Tình trạng']];
  stockItems().forEach((i,idx) => {
    const cat = db.categories.find(c=>c.id===i.cat);
    const tt = i.stock<=0?'Hết hàng':i.stock<=i.minStock?'Sắp hết':'Đủ hàng';
    stockRows.push([idx+1, i.name, cat?.name||i.cat, i.unit, i.stock, i.minStock, tt]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stockRows), 'Tồn kho');

  // Sheet 3: Tổng hợp theo dự án
  const sumRows = [['Dự án','Vật tư','Đơn vị','Tổng nhập','Tổng xuất','Tồn hiện tại']];
  db.projects.forEach(proj => {
    const txns = db.transactions.filter(t=>t.project===proj);
    const byItem = {};
    txns.forEach(t=>{
      if(!byItem[t.itemId]) byItem[t.itemId]={nhap:0,xuat:0};
      if(t.type==='nhap') byItem[t.itemId].nhap+=+t.qty;
      else byItem[t.itemId].xuat+=+t.qty;
    });
    Object.entries(byItem).forEach(([id,v])=>{
      const item=db.items.find(i=>i.id===+id);
      sumRows.push([proj, item?.name||id, item?.unit||'', v.nhap, v.xuat, item?.stock??'-']);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sumRows), 'Tổng hợp');

  const date = new Date().toLocaleDateString('vi-VN').replace(/\//g,'-');
  XLSX.writeFile(wb, `KhoVatTu_FeconSouth_${date}.xlsx`);
  toast('✅ Đã xuất file Excel!');
}
