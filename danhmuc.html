<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D78">
<title>Danh mục vật tư – thiết bị · FECON South</title>
<meta name="description" content="Danh mục vật tư, thiết bị phụ trợ và máy móc FECON South: hình ảnh, mã, nhóm, đơn vị.">
<link rel="icon" href="icon-192.png">
<!-- v5.56.0: trang công khai — không cần đăng nhập. Chỉ tên, mã, nhóm, đơn vị, ảnh (không tồn kho / dự án / giá / vị trí máy). -->
<style>
:root{--navy:#0B3D78;--primary:#0056A4;--orange:#F26522;--bg:#F3F5F8;--card:#fff;--text:#14181F;--text2:#5A6676;--border:#DDE3EA}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
.hd{background:var(--navy);color:#fff;padding:14px 16px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.hd-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.lg{background:rgba(255,255,255,.95);border-radius:10px;padding:6px 10px;display:flex}.lg img{height:30px;width:auto;display:block}
.hd h1{font-size:18px;line-height:1.25;margin:0;font-weight:800}.hd p{margin:2px 0 0;font-size:12.5px;opacity:.8}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.staff{display:none;align-items:center;gap:10px;background:#E3ECF7;color:var(--primary);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.staff a{margin-left:auto;background:var(--primary);color:#fff;text-decoration:none;border-radius:9px;padding:7px 12px;font-weight:700;white-space:nowrap}
.q{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;color:var(--text)}
.q:focus{outline:2px solid var(--primary);outline-offset:1px}
.fs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.fs::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap;cursor:pointer}
.f.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sum{font-size:13px;color:var(--text2);margin:6px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.c{display:flex;flex-direction:column;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:0 0 10px;overflow:hidden;min-width:0;font:inherit;color:inherit;cursor:pointer}
.c:focus-visible{outline:2px solid var(--primary)}
.im{position:relative;aspect-ratio:1/1;background:#EEF1F5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover}.ph{font-size:12px;color:#8A93A0;font-weight:700;text-align:center;padding:8px}
.k{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(20,24,31,.62);color:#fff;border-radius:6px;padding:2px 6px}
.ma{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:12.5px;color:var(--primary);margin:8px 10px 2px;word-break:break-all}
.n{font-size:14px;font-weight:700;margin:0 10px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u{font-size:12px;color:var(--text2);margin:3px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;width:100%;margin:14px 0;border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:12px;font-weight:700;color:var(--primary);font-size:14px}
.msg{text-align:center;color:var(--text2);padding:40px 10px;font-size:14px}
.ft{font-size:12px;color:var(--text2);line-height:1.5;margin-top:22px;text-align:center}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.55);display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}@media(min-width:640px){.dlg{align-items:center}}
.box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.box{border-radius:18px}}
.x{float:right;border:0;background:#EEF1F5;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--text)}
.bim{clear:both;background:#EEF1F5;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;margin-top:6px}
.bim img{width:100%;max-height:60vh;object-fit:contain}
.bk{font-size:12.5px;font-weight:700;margin:6px 2px 0;color:var(--text2)}.bk.th{color:#2B8A3E}.bk.mh{color:#B8460A}
.bma{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:19px;color:var(--primary);margin-top:10px;word-break:break-all}
.bn{font-size:19px;font-weight:800;line-height:1.3;margin:2px 0 10px}
.bg{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;border:1px solid var(--border);border-radius:12px;padding:10px 12px}.bg span{color:var(--text2)}
.bapp{display:none;margin-top:12px;text-align:center;background:var(--primary);color:#fff;text-decoration:none;border-radius:12px;padding:12px;font-weight:700}
.note{font-size:12px;color:var(--text2);margin-top:10px;line-height:1.45}
</style>
</head>

const R = a => ({ ma:a[0], name:a[1], cat:a[2], unit:a[3], may:+a[4] === 1, th:a[5], img:a[6], k:a[7] });
const catName = o => o.may ? (DEVS[o.cat] || 'Máy móc') : (CN[o.cat] || CATS[o.cat] || 'Khác');
let TOKEN = ''; try { TOKEN = localStorage.getItem('fecon_token_v5') || ''; } catch (e) {}
async function call(action, data) {
  const r = await fetch(SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ action, data:data || {} }), redirect:'follow' });
  return JSON.parse(await r.text());
}
// ảnh: Drive công khai → lh3 → hỏi máy chủ
const IMG = {}, IQ = []; let IN = 0;
const imgTag = (id, w) => id ? `<img src="${IMG[id] || 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w}" data-id="${esc(id)}" data-w="${w}" loading="lazy" alt="" onerror="imgErr(this)">` : '';
function imgErr(el) {
  const id = el.dataset.id, st = +(el.dataset.st || 0); el.dataset.st = st + 1;
  if (IMG[id] && el.src !== IMG[id]) { el.src = IMG[id]; return; }
  if (st === 0) { el.src = 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + el.dataset.w; return; }
  if (st === 1) { IQ.push(el); pump(); return; }
  el.replaceWith(Object.assign(document.createElement('span'), { className:'ph', textContent:'Chưa có ảnh' }));
}
function pump() {
  while (IN < 4 && IQ.length) {
    const el = IQ.shift(), id = el.dataset.id; IN++;
    (async () => { try { if (!IMG[id]) { const r = await call('dmImg', { id }); if (r && r.success) IMG[id] = r.data; } } catch (e) {}
      if (IMG[id]) el.src = IMG[id]; else imgErr(el); IN--; pump(); })();
  }
}
function view() {
  const q = norm(Q);
  return ROWS.filter(o => (!q || norm(o.name + ' ' + o.ma).includes(q)) && (F === 'all' || (F === 'may' ? o.may : !o.may && o.cat === F)));
}
function render() {
  const V = view(), show = V.slice(0, N);
  $('sum').textContent = V.length === ROWS.length ? ROWS.length + ' món' : V.length + ' / ' + ROWS.length + ' món';
  $('grid').innerHTML = show.map(o => `<button type="button" class="c" onclick="openIt('${esc(o.ma)}')"><span class="im">${o.th ? imgTag(o.th, 320) : '<span class="ph">Chưa có ảnh</span>'}${o.k === 'mh' ? '<span class="k">Minh hoạ</span>' : ''}</span>
    <span class="ma">${esc(o.ma)}</span><span class="n">${esc(o.name)}</span><span class="u">${esc(o.unit)} · ${esc(catName(o))}</span></button>`).join('') || '<div class="msg" style="grid-column:1/-1">Không có món nào</div>';
  $('more').hidden = V.length <= show.length; $('more').textContent = 'Xem thêm ' + (V.length - show.length) + ' món';
}
function chips() {
  const cnt = k => ROWS.filter(o => k === 'all' || (k === 'may' ? o.may : !o.may && o.cat === k)).length;
  const ids = [...new Set(ROWS.filter(o => !o.may).map(o => o.cat))];
  const L = [['all', 'Tất cả']].concat(ids.map(id => [id, CN[id] || CATS[id] || id]), ROWS.some(o => o.may) ? [['may', 'Máy móc']] : []);
  $('fs').innerHTML = L.map(([k, l]) => `<button type="button" class="f${F === k ? ' on' : ''}" onclick="F='${esc(k)}';N=60;chips();render()">${esc(l)} ${cnt(k)}</button>`).join('');
}
function openIt(ma) {
  const o = ROWS.find(x => x.ma.toUpperCase() === String(ma).toUpperCase());
  if (!o) { $('box').innerHTML = `<button class="x" onclick="closeIt()" aria-label="Đóng">✕</button><div class="msg">Không thấy mã ${esc(ma)} (có thể đã đổi mã hoặc không hiện công khai).</div>`; $('dlg').classList.add('on'); return; }
  const k = o.k === 'th' ? '<div class="bk th">Ảnh thật (kho FECON chụp)</div>' : o.k === 'mh' ? '<div class="bk mh">Ảnh minh hoạ (lấy trên mạng)</div>' : '';
  $('box').innerHTML = `<button class="x" onclick="closeIt()" aria-label="Đóng">✕</button>
    <div class="bim">${o.img || o.th ? imgTag(o.img || o.th, 900) : '<span class="ph">Chưa có ảnh</span>'}</div>${k}
    <div class="bma">${esc(o.ma)}</div><div class="bn">${esc(o.name)}</div>
    <div class="bg"><span>Nhóm</span><b>${esc(catName(o))}</b><span>Đơn vị</span><b>${esc(o.unit)}</b></div>
    <a class="bapp" href="./#dm=${encodeURIComponent(o.ma)}" style="${TOKEN ? 'display:block' : ''}">Nhân viên: xem tồn kho, lập phiếu trong app ›</a>
    <div class="note">Mã quét từ tem QR dán trên hàng. Muốn biết tồn kho hoặc mượn / xuất hàng: liên hệ thủ kho công trình.</div>`;
  $('dlg').classList.add('on');
  try { history.replaceState(null, '', '#m=' + encodeURIComponent(o.ma)); } catch (e) {}
}
function closeIt() { $('dlg').classList.remove('on'); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
$('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeIt(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIt(); });
$('q').addEventListener('input', e => { Q = e.target.value; N = 60; clearTimeout(window.__t); window.__t = setTimeout(render, 180); });
$('more').addEventListener('click', () => { N += 60; render(); });
const hashMa = () => { const m = String(location.hash).match(/m=([^&]+)/); return m ? decodeURIComponent(m[1]) : ''; };
window.addEventListener('hashchange', () => { const m = hashMa(); if (m && ROWS.length) openIt(m); });
if (TOKEN) $('staff').style.display = 'flex';
(async () => {
  let r = null;
  for (let i = 0; i < 3 && !(r && r.success); i++) { try { r = await call('dmPublic'); } catch (e) { await new Promise(s => setTimeout(s, 1500 * (i + 1))); } }
  if (!r || !r.success) { $('grid').innerHTML = '<div class="msg" style="grid-column:1/-1">Không tải được danh mục — kiểm tra mạng rồi tải lại trang.</div>'; return; }
  (r.cats || []).forEach(c => CN[c.id] = c.name);
  ROWS = (r.rows || []).map(R);
  chips(); render();
  const m = hashMa(); if (m) openIt(m);
})();
</script>
</body>
</html>
